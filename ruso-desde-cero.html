    const w=shuffle(VOCAB.filter((_,i)=>i!==quizOrder[0])).slice(0,3).map(v=>v.es);

                    ) : (
                      <>
                        <div style={{fontSize:15,fontWeight:700,color:C.dkgreen,marginBottom:4,lineHeight:1.2}}>{v.es}</div>
                        <div style={{fontSize:12,color:"#7A6A4A",fontStyle:"italic",marginBottom:3}}>[{v.tr}]</div>
                        <div style={{fontSize:12,color:C.navy,opacity:.55}}>{v.ru}</div>
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        )}

        {/* ── QUIZ ── */}
        {tab==="quiz" && (
          <>
            {qDone ? (
              <div style={{background:"white",borderRadius:18,padding:"36px 20px",textAlign:"center",boxShadow:"0 4px 20px rgba(30,47,82,.1)"}}>
                <div style={{fontSize:60,marginBottom:12}}>{qScore.c/VOCAB.length>=.8?"🏆":qScore.c/VOCAB.length>=.5?"⭐":"📚"}</div>
                <div style={{fontSize:24,fontWeight:800,color:C.navy,marginBottom:8}}>¡Quiz completado!</div>
                <div style={{fontSize:36,fontWeight:800,color:C.gold,marginBottom:8}}>{qScore.c} / {VOCAB.length}</div>
                <div style={{fontSize:15,color:"#666",marginBottom:24}}>
                  {qScore.c/VOCAB.length>=.8?"¡Dominas el vocabulario básico!":qScore.c/VOCAB.length>=.5?"¡Bien! Sigue practicando.":"Sigue estudiando, ¡puedes hacerlo! 💪"}
                </div>
                <button onClick={()=>{setQStep(0);setQAns(null);setQScore({c:0,w:0});setQDone(false);const wi=quizOrder[0];const w=shuffle(VOCAB.filter((_,i)=>i!==wi)).slice(0,3).map(v=>v.es);setQOpts(shuffle([VOCAB[wi].es,...w]));}}
                  style={{background:C.navy,color:"white",border:"none",padding:"14px 32px",borderRadius:13,fontSize:15,fontWeight:700,cursor:"pointer"}}>
                  Volver a intentar
                </button>
              </div>
            ) : (
              <>
                {/* Score */}
                <div style={{display:"flex",gap:10,marginBottom:16}}>
                  {[["✅","Correctas",qScore.c,C.green],["❌","Errores",qScore.w,"#C42B2B"],["🎯","Quedan",VOCAB.length-qStep,C.navy]].map(([emoji,label,num,color])=>(
                    <div key={label} style={{flex:1,background:"white",borderRadius:12,padding:"12px",textAlign:"center",boxShadow:"0 2px 10px rgba(30,47,82,.07)"}}>
                      <div style={{fontSize:24,fontWeight:800,color}}>{num}</div>
                      <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:1,color:"#AAA",fontWeight:700,marginTop:2}}>{label}</div>
                    </div>
                  ))}
                </div>

                {/* Pregunta */}
                <div style={{background:"white",borderRadius:18,padding:"28px 20px 22px",textAlign:"center",boxShadow:"0 4px 20px rgba(30,47,82,.1)",marginBottom:16}}>
                  <div style={{fontSize:11,fontWeight:700,color:C.amber,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>{qWord.cat}</div>
                  <div style={{fontSize:38,fontWeight:800,color:C.navy,marginBottom:6,lineHeight:1.1}}>{qWord.ru}</div>
                  <div style={{fontSize:14,color:"#9A7A3A",fontStyle:"italic"}}>[{qWord.tr}]</div>
                </div>

                {/* Feedback */}
                {qAns && (
                  <div style={{textAlign:"center",padding:"12px",borderRadius:12,marginBottom:12,fontWeight:700,fontSize:15,background:qAns===qWord.es?"#E0F5E8":"#FDECEC",color:qAns===qWord.es?C.dkgreen:"#8A1A1A"}}>
                    {qAns===qWord.es?`✅ ¡Correcto! "${qWord.ru}" = ${qWord.es}`:`❌ Era: "${qWord.es}"`}
                  </div>
                )}

                {/* Opciones */}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                  {qOpts.map((opt,i)=>{
                    let bg="white",bc="#DDD",tc="#1A1A2A";
                    if(qAns){
                      if(opt===qWord.es){bg="#E0F5E8";bc=C.green;tc=C.dkgreen;}
                      else if(opt===qAns){bg="#FDECEC";bc="#C42B2B";tc="#8A1A1A";}
                    }
                    return (
                      <button key={i} onClick={()=>{if(!qAns){setQAns(opt);setQScore(sc=>({c:sc.c+(opt===qWord.es?1:0),w:sc.w+(opt===qWord.es?0:1)}));}}}
                        style={{background:bg,border:`2px solid ${bc}`,borderRadius:12,padding:"14px 10px",fontSize:14,fontWeight:600,cursor:qAns?"default":"pointer",color:tc,lineHeight:1.2}}>
                        {opt}
                      </button>
                    );
                  })}
                </div>

                {qAns && (
                  <button onClick={nextQ} style={{width:"100%",background:C.navy,color:"white",border:"none",padding:14,borderRadius:13,fontSize:15,fontWeight:700,cursor:"pointer"}}>
                    {qStep+1<VOCAB.length?"Siguiente →":"Ver resultado 🎉"}
                  </button>
                )}
              </>
            )}
          </>
        )}

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
