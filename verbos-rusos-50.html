<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50 Verbos Rusos</title>
<style>
:root{
  --bg:#0f1117; --panel:#181c26; --panel2:#20242f; --text:#eef0f5; --muted:#9aa3b5;
  --accent:#5b8def; --accent2:#7fd9a8; --warn:#e8a33d; --danger:#e8626a; --border:#2a2f3d;
}
*{box-sizing:border-box}
body.light{
  --bg:#f5f6fa; --panel:#ffffff; --panel2:#eef0f6; --text:#1b1f2a; --muted:#5b6274;
  --accent:#3462cf; --accent2:#1f9d5c; --warn:#b5760f; --danger:#c23744; --border:#dde1ea;
}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
.app{max-width:820px;margin:0 auto;padding:16px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
header h1{font-size:18px;margin:0}
.iconbtn{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px}
.cyr{font-family:'Georgia',serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:transform .1s}
.card:active{transform:scale(.97)}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0;color:var(--muted);font-size:12px}
.progressbar{height:6px;background:var(--panel2);border-radius:4px;margin-top:8px;overflow:hidden}
.progressbar > div{height:100%;background:var(--accent2)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--muted);margin-right:6px}
.section{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px}
.section h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
.verbTitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verbTitle h1{margin:0;font-size:28px}
.speakBtn{background:var(--accent);color:#fff;border:none;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 4px;border-bottom:1px solid var(--border)}
td.pron{color:var(--accent);width:44px;font-weight:600}
td.end{color:var(--warn);font-weight:700}
.exList{list-style:none;margin:0;padding:0}
.exList li{padding:8px 0;border-bottom:1px solid var(--border)}
.exList .ru{font-size:15px}
.exList .es{color:var(--muted);font-size:13px}
.vocabRow{display:flex;flex-wrap:wrap;gap:8px}
.vchip{background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:13px}
.vchip b{display:block;font-size:14px}
.vchip span{color:var(--muted);font-size:11px}
.navbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0}
.navbar button{background:none;border:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 10px}
.navbar button.active{color:var(--accent)}
.navbar .ic{font-size:18px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer}
.btn.secondary{background:var(--panel2);color:var(--text)}
.btn.block{width:100%;margin-top:10px}
.flash{background:var(--panel2);border-radius:16px;padding:30px 16px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer;user-select:none}
.flash .big{font-size:26px}
.flash .small{color:var(--muted);font-size:14px}
.choices{display:grid;gap:8px;margin-top:14px}
.choice{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:left;cursor:pointer;font-size:15px;color:var(--text)}
.choice.correct{border-color:var(--accent2);background:rgba(127,217,168,.15)}
.choice.wrong{border-color:var(--danger);background:rgba(232,98,106,.15)}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.statbox{background:var(--panel2);border-radius:12px;padding:12px;text-align:center}
.statbox .n{font-size:22px;font-weight:700;color:var(--accent)}
.statbox .l{font-size:11px;color:var(--muted)}
.topline{display:flex;justify-content:space-between;align-items:center}
.back{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:0 0 10px}
.err{color:var(--danger);font-size:13px;margin-top:6px}
.moduleHead{display:flex;justify-content:space-between;align-items:center}
.badge{background:var(--accent);color:#fff;border-radius:20px;font-size:11px;padding:2px 8px}
.dim{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="navbar">
  <button id="nav-home" class="active"><span class="ic">🏠</span>Módulos</button>
  <button id="nav-practice"><span class="ic">🎯</span>Practicar</button>
  <button id="nav-stats"><span class="ic">📊</span>Progreso</button>
  <button id="nav-theme"><span class="ic">🌓</span>Tema</button>
</div>

<script>
/* ============ DATOS: 50 verbos ============ */
const PRON = {"я":"ya","ты":"ty","он/она":"on/aná","мы":"my","вы":"vy","они":"aní"};
const verbs = [
{id:1,inf:"быть",es:"ser / estar",aspect:"impf",freq:5,tense:"fut",
 conj:["буду","будешь","будет","будем","будете","будут"],
 case_:"—",caseNote:"Verbo de enlace; no rige caso propio, conecta con nominativo o instrumental (быть врачом = ser médico).",
 ex:[["Я буду дома.","Estaré en casa."],["Он был студентом.","Él era estudiante."],["Это будет трудно.","Esto será difícil."],["Мы были в Москве.","Estuvimos en Moscú."]],
 vocab:[["дом","casa"],["студент","estudiante"],["трудно","difícil"],["вчера","ayer"],["завтра","mañana"],["всегда","siempre"]]},
{id:2,inf:"иметь",es:"tener",aspect:"impf",freq:3,tense:"pres",
 conj:["имею","имеешь","имеет","имеем","имеете","имеют"],
 case_:"Acusativo",caseNote:"иметь + Acusativo: иметь право (tener derecho), иметь машину.",
 ex:[["Я имею право.","Tengo derecho."],["Он имеет машину.","Él tiene un coche."],["Это не имеет значения.","Esto no tiene importancia."]],
 vocab:[["право","derecho"],["значение","importancia"],["машина","coche"],["опыт","experiencia"]]},
{id:3,inf:"делать",es:"hacer",aspect:"impf",freq:5,tense:"pres",
 conj:["делаю","делаешь","делает","делаем","делаете","делают"],
 case_:"Acusativo",caseNote:"делать + Acusativo: делать работу, делать ошибку.",
 ex:[["Я делаю домашнее задание.","Hago los deberes."],["Что ты делаешь?","¿Qué haces?"],["Она делает ошибку.","Ella comete un error."],["Мы делаем это вместе.","Lo hacemos juntos."]],
 vocab:[["работа","trabajo"],["ошибка","error"],["задание","tarea"],["вместе","juntos"]]},
{id:4,inf:"говорить",es:"hablar",aspect:"impf",freq:5,tense:"pres",
 conj:["говорю","говоришь","говорит","говорим","говорите","говорят"],
 case_:"о + Prepositional / по + Dativo",caseNote:"говорить о чём (Prep.), говорить по-русски, говорить с кем (Instr.).",
 ex:[["Я говорю по-русски.","Hablo ruso."],["Мы говорим о фильме.","Hablamos sobre la película."],["Он говорит с другом.","Él habla con su amigo."],["Говори медленно, пожалуйста.","Habla despacio, por favor."]],
 vocab:[["язык","idioma"],["друг","amigo"],["фильм","película"],["медленно","despacio"],["громко","en voz alta"]]},
{id:5,inf:"сказать",es:"decir",aspect:"perf",freq:5,tense:"fut",
 conj:["скажу","скажешь","скажет","скажем","скажете","скажут"],
 case_:"Dativo (кому) + Acusativo (что)",caseNote:"сказать кому-то что-то: Я скажу тебе правду.",
 ex:[["Я скажу тебе правду.","Te diré la verdad."],["Он сказал: 'Привет!'","Él dijo: '¡Hola!'"],["Скажи мне, пожалуйста.","Dime, por favor."]],
 vocab:[["правда","verdad"],["слово","palabra"],["ответ","respuesta"]]},
{id:6,inf:"идти",es:"ir (a pie, ahora)",aspect:"impf",freq:5,tense:"pres",
 conj:["иду","идёшь","идёт","идём","идёте","идут"],
 case_:"Acusativo (dirección: в/на + Ac.)",caseNote:"идти в школу, идти на работу — movimiento unidireccional en curso.",
 ex:[["Я иду домой.","Voy a casa."],["Куда ты идёшь?","¿Adónde vas?"],["Мы идём в кино.","Vamos al cine."]],
 vocab:[["дом","casa"],["школа","escuela"],["кино","cine"],["улица","calle"]]},
{id:7,inf:"ходить",es:"ir (a pie, habitual)",aspect:"impf",freq:4,tense:"pres",
 conj:["хожу","ходишь","ходит","ходим","ходите","ходят"],
 case_:"Acusativo (в/на + Ac.)",caseNote:"Acción repetida o de ida y vuelta: я хожу в спортзал каждый день.",
 ex:[["Я хожу в спортзал каждый день.","Voy al gimnasio todos los días."],["Он часто ходит в парк.","Él va al parque a menudo."]],
 vocab:[["спортзал","gimnasio"],["парк","parque"],["каждый день","cada día"],["часто","a menudo"]]},
{id:8,inf:"ехать",es:"ir (en transporte, ahora)",aspect:"impf",freq:4,tense:"pres",
 conj:["еду","едешь","едет","едем","едете","едут"],
 case_:"Acusativo (dirección)",caseNote:"Movimiento en transporte, unidireccional: мы едем в Барселону.",
 ex:[["Мы едем в Барселону.","Vamos a Barcelona (en transporte)."],["Куда вы едете?","¿Adónde van?"]],
 vocab:[["поезд","tren"],["машина","coche"],["автобус","autobús"]]},
{id:9,inf:"ездить",es:"ir (en transporte, habitual)",aspect:"impf",freq:3,tense:"pres",
 conj:["езжу","ездишь","ездит","ездим","ездите","ездят"],
 case_:"Acusativo (dirección)",caseNote:"Viajes repetidos: я езжу на работу на метро.",
 ex:[["Я езжу на работу на метро.","Voy al trabajo en metro."],["Они ездят в Россию каждый год.","Ellos viajan a Rusia cada año."]],
 vocab:[["метро","metro"],["работа","trabajo"],["год","año"]]},
{id:10,inf:"жить",es:"vivir",aspect:"impf",freq:5,tense:"pres",
 conj:["живу","живёшь","живёт","живём","живёте","живут"],
 case_:"Prepositional (где)",caseNote:"жить в городе (Prep.): dónde se vive.",
 ex:[["Я живу в Барселоне.","Vivo en Barcelona."],["Где ты живёшь?","¿Dónde vives?"],["Мы живём вместе.","Vivimos juntos."]],
 vocab:[["город","ciudad"],["квартира","piso"],["страна","país"]]},
{id:11,inf:"работать",es:"trabajar",aspect:"impf",freq:5,tense:"pres",
 conj:["работаю","работаешь","работает","работаем","работаете","работают"],
 case_:"Instrumental (кем) / в + Prep. (где)",caseNote:"работать кем-то (Instr.): работать инженером; где: работать в офисе.",
 ex:[["Я работаю в офисе.","Trabajo en una oficina."],["Он работает инженером.","Él trabaja como ingeniero."],["Мы работаем вместе.","Trabajamos juntos."]],
 vocab:[["офис","oficina"],["инженер","ingeniero"],["зарплата","salario"]]},
{id:12,inf:"учиться",es:"estudiar / aprender",aspect:"impf",freq:4,tense:"pres",
 conj:["учусь","учишься","учится","учимся","учитесь","учатся"],
 case_:"Dativo (чему) / в + Prep. (где)",caseNote:"учиться чему-то (Dat.): учиться русскому языку; где: учиться в университете.",
 ex:[["Я учусь в университете.","Estudio en la universidad."],["Она учится русскому языку.","Ella aprende ruso."]],
 vocab:[["университет","universidad"],["урок","lección"],["студент","estudiante"]]},
{id:13,inf:"знать",es:"saber / conocer",aspect:"impf",freq:5,tense:"pres",
 conj:["знаю","знаешь","знает","знаем","знаете","знают"],
 case_:"Acusativo",caseNote:"знать + Acusativo: знать ответ, знать человека.",
 ex:[["Я знаю ответ.","Sé la respuesta."],["Ты знаешь этого человека?","¿Conoces a esa persona?"],["Мы не знаем.","No lo sabemos."]],
 vocab:[["ответ","respuesta"],["человек","persona"],["правило","regla"]]},
{id:14,inf:"думать",es:"pensar",aspect:"impf",freq:5,tense:"pres",
 conj:["думаю","думаешь","думает","думаем","думаете","думают"],
 case_:"о + Prepositional",caseNote:"думать о чём/ком (Prep.): думаю о тебе.",
 ex:[["Я думаю о тебе.","Pienso en ti."],["Что ты думаешь об этом?","¿Qué piensas de esto?"],["Он много думает.","Él piensa mucho."]],
 vocab:[["мысль","pensamiento"],["идея","idea"],["мнение","opinión"]]},
{id:15,inf:"понимать",es:"entender",aspect:"impf",freq:5,tense:"pres",
 conj:["понимаю","понимаешь","понимает","понимаем","понимаете","понимают"],
 case_:"Acusativo",caseNote:"понимать + Acusativo: понимаю тебя, понимаю текст.",
 ex:[["Я тебя понимаю.","Te entiendo."],["Ты понимаешь по-русски?","¿Entiendes ruso?"],["Я не понимаю.","No entiendo."]],
 vocab:[["текст","texto"],["смысл","sentido"],["урок","lección"]]},
{id:16,inf:"видеть",es:"ver",aspect:"impf",freq:5,tense:"pres",
 conj:["вижу","видишь","видит","видим","видите","видят"],
 case_:"Acusativo",caseNote:"видеть + Acusativo: вижу дом, вижу тебя.",
 ex:[["Я вижу тебя.","Te veo."],["Он видит море.","Él ve el mar."],["Мы видим проблему.","Vemos el problema."]],
 vocab:[["море","mar"],["проблема","problema"],["глаз","ojo"]]},
{id:17,inf:"смотреть",es:"mirar / ver (TV)",aspect:"impf",freq:5,tense:"pres",
 conj:["смотрю","смотришь","смотрит","смотрим","смотрите","смотрят"],
 case_:"на + Acusativo",caseNote:"смотреть на кого/что (Ac.): смотрю на тебя; смотреть телевизор (sin preposición, objeto directo).",
 ex:[["Я смотрю телевизор.","Veo la televisión."],["Она смотрит на меня.","Ella me mira."],["Мы смотрим фильм.","Vemos una película."]],
 vocab:[["телевизор","televisión"],["фильм","película"],["окно","ventana"]]},
{id:18,inf:"слышать",es:"oír",aspect:"impf",freq:4,tense:"pres",
 conj:["слышу","слышишь","слышит","слышим","слышите","слышат"],
 case_:"Acusativo",caseNote:"слышать + Acusativo: слышу музыку.",
 ex:[["Я слышу музыку.","Oigo música."],["Ты слышишь меня?","¿Me oyes?"]],
 vocab:[["музыка","música"],["звук","sonido"],["шум","ruido"]]},
{id:19,inf:"слушать",es:"escuchar",aspect:"impf",freq:5,tense:"pres",
 conj:["слушаю","слушаешь","слушает","слушаем","слушаете","слушают"],
 case_:"Acusativo",caseNote:"слушать + Acusativo: слушаю музыку, слушаю тебя.",
 ex:[["Я слушаю музыку.","Escucho música."],["Слушай меня внимательно.","Escúchame con atención."]],
 vocab:[["внимательно","con atención"],["радио","radio"],["песня","canción"]]},
{id:20,inf:"читать",es:"leer",aspect:"impf",freq:5,tense:"pres",
 conj:["читаю","читаешь","читает","читаем","читаете","читают"],
 case_:"Acusativo",caseNote:"читать + Acusativo: читаю книгу.",
 ex:[["Я читаю книгу.","Leo un libro."],["Он читает газету.","Él lee el periódico."],["Что ты читаешь?","¿Qué lees?"]],
 vocab:[["книга","libro"],["газета","periódico"],["статья","artículo"],["письмо","carta"],["новости","noticias"]]},
{id:21,inf:"писать",es:"escribir",aspect:"impf",freq:5,tense:"pres",
 conj:["пишу","пишешь","пишет","пишем","пишете","пишут"],
 case_:"Acusativo / Dativo (кому)",caseNote:"писать что кому: пишу письмо другу.",
 ex:[["Я пишу письмо другу.","Escribo una carta a mi amigo."],["Она пишет книгу.","Ella escribe un libro."]],
 vocab:[["письмо","carta"],["ручка","bolígrafo"],["текст","texto"]]},
{id:22,inf:"любить",es:"amar / gustar mucho",aspect:"impf",freq:5,tense:"pres",
 conj:["люблю","любишь","любит","любим","любите","любят"],
 case_:"Acusativo",caseNote:"любить + Acusativo: люблю тебя, люблю музыку.",
 ex:[["Я люблю тебя.","Te amo."],["Он любит читать.","A él le encanta leer."],["Мы любим этот город.","Amamos esta ciudad."]],
 vocab:[["любовь","amor"],["сердце","corazón"],["счастье","felicidad"]]},
{id:23,inf:"нравиться",es:"gustar",aspect:"impf",freq:5,tense:"pres",
 conj:["нравлюсь","нравишься","нравится","нравимся","нравитесь","нравятся"],
 case_:"Dativo (кому) + Nominativo (qué gusta)",caseNote:"Мне нравится музыка = 'a mí me gusta la música' (sujeto gramatical es lo que gusta).",
 ex:[["Мне нравится музыка.","Me gusta la música."],["Тебе нравится этот фильм?","¿Te gusta esta película?"],["Нам нравится Барселона.","Nos gusta Barcelona."]],
 vocab:[["вкус","gusto"],["интерес","interés"]]},
{id:24,inf:"хотеть",es:"querer",aspect:"impf",freq:5,tense:"pres",
 conj:["хочу","хочешь","хочет","хотим","хотите","хотят"],
 case_:"Acusativo / Genitivo (parcial) + infinitivo",caseNote:"хотеть + Acusativo o infinitivo: хочу кофе, хочу спать.",

 vocab:[["кофе","café"],["желание","deseo"],["мечта","sueño"]]},
{id:25,inf:"мочь",es:"poder",aspect:"impf",freq:5,tense:"pres",
 conj:["могу","можешь","может","можем","можете","могут"],
 case_:"— (+ infinitivo)",caseNote:"мочь + infinitivo, sin caso propio: я могу помочь.",

 vocab:[["возможность","posibilidad"],["сила","fuerza"]]},
{id:26,inf:"давать",es:"dar",aspect:"impf",freq:4,tense:"pres",
 conj:["даю","даёшь","даёт","даём","даёте","дают"],
 case_:"Dativo (кому) + Acusativo (что)",caseNote:"давать кому что: даю тебе книгу.",
 ex:[["Я даю тебе книгу.","Te doy un libro."],["Он даёт совет.","Él da un consejo."]],
 vocab:[["совет","consejo"],["подарок","regalo"]]},
{id:27,inf:"брать",es:"tomar / coger",aspect:"impf",freq:4,tense:"pres",
 conj:["беру","берёшь","берёт","берём","берёте","берут"],
 case_:"Acusativo",caseNote:"брать + Acusativo: беру такси, беру книгу.",
 ex:[["Я беру такси.","Tomo un taxi."],["Возьми зонт.","Coge un paraguas."]],
 vocab:[["такси","taxi"],["зонт","paraguas"]]},
{id:28,inf:"получать",es:"recibir",aspect:"impf",freq:4,tense:"pres",
 conj:["получаю","получаешь","получает","получаем","получаете","получают"],
 case_:"Acusativo",caseNote:"получать + Acusativo: получаю письмо, получаю зарплату.",
 ex:[["Я получаю зарплату.","Recibo el salario."],["Он получил письмо.","Él recibió una carta."]],
 vocab:[["зарплата","salario"],["посылка","paquete"]]},
{id:29,inf:"покупать",es:"comprar",aspect:"impf",freq:5,tense:"pres",
 conj:["покупаю","покупаешь","покупает","покупаем","покупаете","покупают"],

/* ============ ESTADO (en memoria, sesión actual) ============ */
const state = {
  srs: {}, // id -> level 0-4
  history: [], // {id, correct}
  xp: 0,
  view: {name:'home', verbId:null},
  theme: 'dark'
};
verbs.forEach(v=>state.srs[v.id]=0);

function levelName(l){return ["Nuevo","Aprendido","En práctica","Dominado","Automático"][l];}

/* ============ TTS ============ */
function speak(text){
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU'; u.rate = 0.85;
    const voices = speechSynthesis.getVoices();
    const rv = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('ru'));
    if(rv) u.voice = rv;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){console.warn('TTS no disponible',e);}
}

/* ============ RENDER ============ */
const app = document.getElementById('app');

function render(){
  const v = state.view;
  let html = `<header><h1>🇷🇺 50 Verbos</h1><div class="pill">${state.xp} XP</div></header>`;
  if(v.name==='home') html += renderHome();
  else if(v.name==='module') html += renderModule(v.moduleId);
  else if(v.name==='verb') html += renderVerb(v.verbId);
  else if(v.name==='practice') html += renderPracticeMenu();
  else if(v.name==='flashcards') html += renderFlashcards();
  else if(v.name==='caseEx') html += renderCaseExercise();
  else if(v.name==='fillblank') html += renderFillBlank();
  else if(v.name==='stats') html += renderStats();
  app.innerHTML = html;
  attachHandlers();
}

function renderHome(){
  let out = `<p class="dim">Domina los verbos más usados del ruso, módulo a módulo.</p><div class="grid">`;
  for(let m=1;m<=10;m++){
    const mv = verbs.filter(x=>x.module===m);
    const avg = mv.reduce((a,x)=>a+state.srs[x.id],0)/mv.length;
    out += `<div class="card" data-mod="${m}">
      <span class="badge">Módulo ${m}</span>
      <h3 style="margin-top:8px">${mv.map(x=>x.inf).join(', ')}</h3>
      <div class="progressbar"><div style="width:${avg/4*100}%"></div></div>
      <p style="margin-top:6px">${mv.length} verbos</p>
    </div>`;
  }
  out += `</div>`;
  return out;
}

function renderModule(m){
  const mv = verbs.filter(x=>x.module===m);
  let out = `<button class="back" data-go="home">← Módulos</button>
  <div class="moduleHead"><h2 style="margin:0">Módulo ${m}</h2></div>`;
  mv.forEach(v=>{
    out += `<div class="card" style="margin-top:10px" data-verb="${v.id}">
      <div class="topline"><h3 class="cyr">${v.inf}</h3><span class="pill">${'★'.repeat(v.freq)}</span></div>
      <p>${v.es} · ${levelName(state.srs[v.id])}</p>
    </div>`;
  });
  return out;
}

function renderPracticeMenu(){
  return `<div class="section"><h2>Modo de práctica</h2>
   <button class="btn block" data-go="flashcards">🃏 Flashcards (repetición espaciada)</button>
   <button class="btn block secondary" data-go="caseEx">🎯 Elegir el caso correcto</button>

   </div>
   <div class="section"><h2>Cómo funciona el SRS</h2>
   <p class="dim">Cada verbo tiene un nivel de 0 (nuevo) a 4 (automático). Acertar sube de nivel; fallar te devuelve práctica más frecuente de ese verbo. Se prioriza lo que menos dominas.</p></div>`;

// --- Utilidad SRS: elegir verbo a practicar (prioriza nivel bajo)
function pickVerbWeighted(excludeId){
  const pool = verbs.filter(v=>v.id!==excludeId);
  const weights = pool.map(v=>5-state.srs[v.id]+0.5);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<pool.length;i++){ r-=weights[i]; if(r<=0) return pool[i]; }
  return pool[0];
}

let currentDrill = null;

function newFlashcard(){
  const v = pickVerbWeighted(null);
  const dir = Math.random()<0.5 ? 'ru-es' : 'es-ru';
  currentDrill = {type:'flash', verb:v, dir, revealed:false};
}
function renderFlashcards(){
  if(!currentDrill || currentDrill.type!=='flash') newFlashcard();
  const {verb,dir,revealed} = currentDrill;
  const front = dir==='ru-es' ? verb.inf : verb.es;
  const backTxt = dir==='ru-es' ? verb.es : verb.inf;
  return `<button class="back" data-go="practice">← Practicar</button>
  <div class="dim">Nivel actual: ${levelName(state.srs[verb.id])} · Módulo ${verb.module}</div>
  <div class="flash" id="flashcard">
    <div class="big ${dir==='ru-es'?'cyr':''}">${front}</div>
    ${revealed?`<div class="small ${dir==='es-ru'?'cyr':''}">${backTxt}</div>`:'<div class="small">Toca para revelar</div>'}
  </div>
  ${revealed?`<div class="choices">
     <button class="choice" data-drill-answer="know">✅ Lo sabía</button>
     <button class="choice" data-drill-answer="unsure">🤔 Dudé</button>
     <button class="choice" data-drill-answer="fail">❌ No lo sabía</button>
   </div>`:''}`;
}

function renderCaseExercise(){
  if(!currentDrill || currentDrill.type!=='case'){
    const v = pickVerbWeighted(null);
    const others = verbs.filter(x=>x.case_!==v.case_ && x.case_!=='—').map(x=>x.case_);
    const uniqOthers = [...new Set(others)].filter(c=>c!==v.case_);
    const distractors = uniqOthers.sort(()=>Math.random()-0.5).slice(0,3);
    const options = [v.case_, ...distractors].sort(()=>Math.random()-0.5);
    currentDrill = {type:'case', verb:v, options, answered:false};
  }
  const {verb,options,answered,picked} = currentDrill;
  return `<button class="back" data-go="practice">← Practicar</button>
  <div class="section">
    <h2>¿Qué caso rige este verbo?</h2>
    <div class="verbTitle"><h1 class="cyr">${verb.inf}</h1><span class="pill">${verb.es}</span></div>
    <div class="choices">
      ${options.map(o=>`<button class="choice ${answered?(o===verb.case_?'correct':(o===picked?'wrong':'')):''}" data-case-pick="${o}">${o}</button>`).join('')}
    </div>
    ${answered?`<p class="dim" style="margin-top:10px">${verb.caseNote}</p><button class="btn block" data-go="caseEx">Siguiente →</button>`:''}
  </div>`;
}

function renderFillBlank(){
  if(!currentDrill || currentDrill.type!=='fill'){
    const v = pickVerbWeighted(null);
    const idx = Math.floor(Math.random()*6);
    const forms = ["я","ты","он/она","мы","вы","они"];
    const correct = v.conj[idx];
    const distractors = v.conj.filter((c,i)=>i!==idx).sort(()=>Math.random()-0.5).slice(0,3);
    const options = [correct, ...distractors].sort(()=>Math.random()-0.5);
    currentDrill = {type:'fill', verb:v, idx, options, correct, answered:false, forms};
  }
  const {verb,idx,options,correct,answered,picked,forms} = currentDrill;
  return `<button class="back" data-go="practice">← Practicar</button>
  <div class="section">
    <h2>Completa la conjugación</h2>
    <p>Verbo: <span class="cyr" style="font-size:18px">${verb.inf}</span> (${verb.es})</p>
    <p style="font-size:16px">${forms[idx]} + ___</p>
    <div class="choices">
      ${options.map(o=>`<button class="choice ${answered?(o===correct?'correct':(o===picked?'wrong':'')):''} cyr" data-fill-pick="${o}">${o}</button>`).join('')}
    </div>
    ${answered?`<button class="btn block" data-go="fillblank">Siguiente →</button>`:''}
  </div>`;
}

function renderStats(){
  const total = verbs.length;
  const mastered = verbs.filter(v=>state.srs[v.id]>=3).length;
  const inProgress = verbs.filter(v=>state.srs[v.id]>0 && state.srs[v.id]<3).length;
  const untouched = total - mastered - inProgress;
  const attempts = state.history.length;
  const correct = state.history.filter(h=>h.correct).length;
  const acc = attempts? Math.round(correct/attempts*100) : 0;
  return `<div class="section"><h2>Tu progreso</h2>
  <div class="statgrid">
    <div class="statbox"><div class="n">${mastered}/${total}</div><div class="l">Verbos dominados</div></div>
    <div class="statbox"><div class="n">${inProgress}</div><div class="l">En práctica</div></div>
    <div class="statbox"><div class="n">${acc}%</div><div class="l">Precisión</div></div>
    <div class="statbox"><div class="n">${state.xp}</div><div class="l">XP total</div></div>
  </div></div>
  <div class="section"><h2>Por módulo</h2>
  ${Array.from({length:10},(_,i)=>i+1).map(m=>{
    const mv = verbs.filter(v=>v.module===m);
    const avg = mv.reduce((a,v)=>a+state.srs[v.id],0)/mv.length;
    return `<div style="margin-bottom:8px"><div class="topline"><span>Módulo ${m}</span><span class="dim">${Math.round(avg/4*100)}%</span></div><div class="progressbar"><div style="width:${avg/4*100}%"></div></div></div>`;
  }).join('')}
  </div>
  <p class="err" style="margin-top:10px">Nota: el progreso se guarda solo durante esta sesión del navegador (no usa almacenamiento persistente). Si cierras la pestaña, se reinicia.</p>`;
}

/* ============ EVENTOS ============ */
function updateSRS(id, correct){
  state.history.push({id, correct});
  if(correct){ state.srs[id] = Math.min(4, state.srs[id]+1); state.xp += 10; }
  else { state.srs[id] = Math.max(0, state.srs[id]-1); state.xp += 2; }
}

function attachHandlers(){
  document.querySelectorAll('[data-mod]').forEach(el=>el.addEventListener('click',()=>{
    state.view={name:'module', moduleId:parseInt(el.dataset.mod)}; render();
  }));
  document.querySelectorAll('[data-verb]').forEach(el=>el.addEventListener('click',()=>{
    state.view={name:'verb', verbId:parseInt(el.dataset.verb)}; render();
  }));
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{
    const go = el.dataset.go;
    if(go==='home') state.view={name:'home'};
    else if(go==='module') state.view={name:'module', moduleId:parseInt(el.dataset.mod)};
    else if(go==='practice'){ currentDrill=null; state.view={name:'practice'}; }
    else if(go==='flashcards'){ currentDrill=null; state.view={name:'flashcards'}; }
    else if(go==='caseEx'){ currentDrill=null; state.view={name:'caseEx'}; }
    else if(go==='fillblank'){ currentDrill=null; state.view={name:'fillblank'}; }
    render();
  }));
  document.querySelectorAll('[data-practice-verb]').forEach(el=>el.addEventListener('click',()=>{
    currentDrill=null; state.view={name:'flashcards'}; render();
  }));
  document.querySelectorAll('[data-speak]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation(); speak(el.dataset.speak);
  }));
  const fc = document.getElementById('flashcard');
  if(fc) fc.addEventListener('click', ()=>{ currentDrill.revealed = true; render(); });
  document.querySelectorAll('[data-drill-answer]').forEach(el=>el.addEventListener('click',()=>{
    const ans = el.dataset.drillAnswer;
    updateSRS(currentDrill.verb.id, ans==='know');
    newFlashcard(); render();
  }));
  document.querySelectorAll('[data-case-pick]').forEach(el=>el.addEventListener('click',()=>{
    if(currentDrill.answered) return;
    const pick = el.dataset.casePick;
    currentDrill.answered = true; currentDrill.picked = pick;
    updateSRS(currentDrill.verb.id, pick===currentDrill.verb.case_);
    render();
  }));
  document.querySelectorAll('[data-fill-pick]').forEach(el=>el.addEventListener('click',()=>{
    if(currentDrill.answered) return;
    const pick = el.dataset.fillPick;
    currentDrill.answered = true; currentDrill.picked = pick;
    updateSRS(currentDrill.verb.id, pick===currentDrill.correct);
    render();
  }));
}

/* ============ NAV INFERIOR ============ */
document.getElementById('nav-home').addEventListener('click',()=>{state.view={name:'home'};setActiveNav('nav-home');render();});
document.getElementById('nav-practice').addEventListener('click',()=>{currentDrill=null;state.view={name:'practice'};setActiveNav('nav-practice');render();});
document.getElementById('nav-stats').addEventListener('click',()=>{state.view={name:'stats'};setActiveNav('nav-stats');render();});
document.getElementById('nav-theme').addEventListener('click',()=>{
  document.body.classList.toggle('light');
});
function setActiveNav(id){
  document.querySelectorAll('.navbar button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

if(typeof speechSynthesis!=='undefined'){ speechSynthesis.onvoiceschanged = ()=>{}; }
render();
</script>

</html>
